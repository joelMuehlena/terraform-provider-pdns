# PowerDNS Recursor of the full-stack example (YAML settings, Recursor 5.x).
# Replaces the recursor.conf of the image.
recursor:
  include_dir: /etc/powerdns/recursor.d
  # The zones of pdns-auth: forwarded to it (non-recursive queries), all other
  # names are resolved from the root.
  forward_zones:
    - zone: example.test
      forwarders: [10.53.0.10:5353]
    - zone: legacy.test
      forwarders: [10.53.0.10:5353]

incoming:
  listen: [0.0.0.0]
  port: 5353
  # allow_from keeps its default, the private address ranges: queries from
  # the host arrive from an address of the container runtime (see
  # allow-dnsupdate-from in pdns/pdns.conf), and the port is only published on
  # 127.0.0.1.

dnssec:
  # The example zones are unsigned and .test does not exist in the root zone,
  # so validation would mark their answers as bogus.
  negative_trustanchors:
    - name: example.test
      reason: unsigned example zone
    - name: legacy.test
      reason: unsigned example zone
