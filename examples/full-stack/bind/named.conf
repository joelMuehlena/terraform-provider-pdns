// BIND 9 of the full-stack example: secondary of the pdns zone example.test
// and primary of legacy.test, which pdns-auth transfers as a Slave zone.

// The TSIG keys bind-axfr and pdns-secondary. Written by infra/
// (local_sensitive_file) with the secrets it manages in PowerDNS; restart
// BIND after they change (`docker compose restart bind`).
include "/etc/bind/keys/tsig-keys.conf";

options {
  directory "/var/cache/bind";
  listen-on port 5353 { any; };
  listen-on-v6 { none; };
  recursion no;
  dnssec-validation no;
  allow-transfer { none; };
  notify no;
};

// Primary of legacy.test. pdns-auth (10.53.0.10) transfers it signed with
// pdns-secondary (pdns_zone_tsig_key with secondary = true) and is notified
// of changes.
zone "legacy.test" {
  type primary;
  file "/etc/bind/zones/legacy.test.zone";
  allow-transfer { key "pdns-secondary"; };
  notify explicit;
  also-notify { 10.53.0.10 port 5353; };
};

// Secondary of example.test, which pdns-auth serves as primary (kind
// Master). The transfer is signed with bind-axfr (pdns_zone_tsig_key with
// axfr = true); pdns-auth sends NOTIFY when the serial changes.
zone "example.test" {
  type secondary;
  file "example.test.zone";
  primaries { 10.53.0.10 port 5353 key "bind-axfr"; };
  allow-notify { 10.53.0.10; };
};
