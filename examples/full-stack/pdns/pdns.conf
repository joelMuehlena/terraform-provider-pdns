# PowerDNS Authoritative Server of the full-stack example. Replaces the
# pdns.conf of the image; the image's entrypoint writes the API settings
# (API key from PDNS_AUTH_API_KEY) to pdns.d/_api.conf.
include-dir=/etc/powerdns/pdns.d
security-poll-suffix=

local-address=0.0.0.0
local-port=5353

launch=gpgsql
gpgsql-host=10.53.0.5
gpgsql-port=5432
gpgsql-dbname=pdns
gpgsql-user=pdns
gpgsql-password=pdns
gpgsql-dnssec=yes

# Primary of the Master zone example.test: NOTIFY BIND on every serial change.
# Only BIND is notified (it listens on port 5353), not the addresses of the
# zone's NS records.
primary=yes
only-notify=
also-notify=10.53.0.30:5353
# Secondary of the Slave zone legacy.test, transferred from BIND.
secondary=yes
# Check zones for changed serials (NOTIFY) and due refreshes every 5 seconds
# instead of 60, so that the example converges quickly.
xfr-cycle-interval=5

# Zone transfers: unsigned only from localhost (the default). Signed with a
# key attached with pdns_zone_tsig_key (axfr = true) from everywhere.
allow-axfr-ips=127.0.0.0/8,::1

# RFC2136 dynamic updates: only signed by a key attached to the zone with
# pdns_zone_tsig_key (dnsupdate = true), and only from these addresses.
# Requests from the host reach the published port through the container
# runtime, which forwards them from an address of its own: the gateway of the
# compose network with Docker on Linux (10.53.0.1), 192.168.65.0/24 with Docker
# Desktop and 192.168.127.0/24 with podman machine (gvproxy). If updates are
# refused, `docker compose logs pdns-auth` shows the address they came from.
dnsupdate=yes
dnsupdate-require-tsig=yes
allow-dnsupdate-from=10.53.0.1/32,192.168.65.0/24,192.168.127.0/24
