version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 35
    labels:
      - dependencies
      - dependencies::go
    assignees:
      - joelMuehlena
    reviewers:
      - joelMuehlena
    commit-message:
      prefix: deps
      include: scope
  # Documentation tooling (tfplugindocs, copywrite) of `mise run generate`.
  - package-ecosystem: gomod
    directory: /tools
    schedule:
      interval: weekly
    labels:
      - dependencies
      - dependencies::go
    assignees:
      - joelMuehlena
    reviewers:
      - joelMuehlena
    commit-message:
      prefix: deps
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - dependencies::gh-actions
    assignees:
      - joelMuehlena
    reviewers:
      - joelMuehlena
    commit-message:
      prefix: deps
      include: scope

  # Images of the acceptance tests, pinned in test/acc/images/*.Dockerfile
  # (Dependabot does not follow the variables in the compose files).
  - package-ecosystem: docker
    directory: /test/acc/images
    schedule:
      interval: weekly
    labels:
      - dependencies
      - dependencies::docker
    assignees:
      - joelMuehlena
    reviewers:
      - joelMuehlena
    commit-message:
      prefix: deps
      include: scope
