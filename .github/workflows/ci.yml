name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tool versions for lint and build come from mise.toml.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: go golangci-lint
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: ${{ runner.os }}-lint-${{ hashFiles('mise.toml', '**/go.sum') }}
          restore-keys: ${{ runner.os }}-lint-
      - run: mise run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: go
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-build-${{ hashFiles('mise.toml', '**/go.sum') }}
          restore-keys: ${{ runner.os }}-build-
      - run: mise run build
      - run: mise run vet

  # docs/ is generated from the schema descriptions, examples/ and the
  # tfplugindocs templates; fail when a change did not regenerate it.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          # tofu formats the examples, terraform exports the provider schema.
          install_args: go terraform opentofu
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-docs-${{ hashFiles('mise.toml', '**/go.sum') }}
          restore-keys: ${{ runner.os }}-docs-
      - run: mise run generate
      - name: Check for drift
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            echo "::error::docs/ or examples/ are out of date. Run 'mise run generate' and commit the result."
            exit 1
          fi

  # Dry run of the OCI publishing of the release workflow: `mise run oci`
  # pushes a goreleaser snapshot to a throwaway TLS registry, the digest must
  # be reproducible, and OpenTofu must install the provider from the
  # registry through an oci_mirror. No signing or attestation. It runs on
  # every change rather than behind path filters (which would leave a
  # required check pending): a snapshot build and a few local pushes are
  # cheap next to the acceptance tests.
  oci:
    runs-on: ubuntu-latest
    env:
      OCI_REPOSITORY: 127.0.0.1:5000/terraform-provider-pdns
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser derives the snapshot version from the latest tag.
          fetch-depth: 0
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: go goreleaser oras opentofu
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-oci-${{ hashFiles('mise.toml', '**/go.sum') }}
          restore-keys: ${{ runner.os }}-oci-
      # OpenTofu only talks HTTPS to OCI registries, so the registry gets a
      # certificate from a CA made up for this run.
      - name: Start a registry with TLS
        run: |
          CERTS=$RUNNER_TEMP/certs
          echo "CERTS=$CERTS" >> "$GITHUB_ENV"
          mkdir -p "$CERTS" && cd "$CERTS"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes \
            -days 1 -subj /CN=oci-dry-run-ca -keyout ca.key -out ca.pem \
            -addext basicConstraints=critical,CA:TRUE -addext keyUsage=critical,keyCertSign
          openssl req -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes \
            -subj /CN=127.0.0.1 -keyout registry.key -out registry.csr
          printf '%s\n' subjectAltName=IP:127.0.0.1 extendedKeyUsage=serverAuth > registry.ext
          openssl x509 -req -in registry.csr -CA ca.pem -CAkey ca.key -CAcreateserial \
            -days 1 -extfile registry.ext -out registry.pem
          chmod a+r registry.key
          # Pinned (tag and digest) in the FROM line of the Dockerfile, which
          # Dependabot keeps up to date; it is not built.
          image=$(sed -n 's/^FROM[[:space:]]*//p' "$GITHUB_WORKSPACE/test/oci/registry.Dockerfile")
          if [ -z "$image" ]; then
            echo "::error::No FROM line in test/oci/registry.Dockerfile."
            exit 1
          fi
          docker run -d --name oci-registry -p 127.0.0.1:5000:5000 -v "$CERTS:/certs:ro" \
            -e REGISTRY_HTTP_TLS_CERTIFICATE=/certs/registry.pem \
            -e REGISTRY_HTTP_TLS_KEY=/certs/registry.key \
            "$image"
          for _ in $(seq 30); do
            curl -sf --cacert ca.pem https://127.0.0.1:5000/v2/ >/dev/null && exit 0
            sleep 1
          done
          docker logs oci-registry
          exit 1
      - name: Publish a snapshot (mise run oci)
        id: publish
        run: |
          ref=$(mise run oci -- --to-ca-file "$CERTS/ca.pem" | tail -n 1)
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version dist/metadata.json)" >> "$GITHUB_OUTPUT"
          echo "Pushed \`$ref\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Check that the digest is reproducible
        env:
          REF: ${{ steps.publish.outputs.ref }}
          VERSION: ${{ steps.publish.outputs.version }}
        run: |
          epoch=$(git log -1 --format=%ct)
          revision=$(git rev-parse HEAD)
          export OCI_REVISION=$revision
          # Later than the first push, so a creation time taken from the
          # clock would change the digest.
          sleep 2
          again=$(SOURCE_DATE_EPOCH=$epoch scripts/oci-publish.sh dist "$VERSION" "$OCI_REPOSITORY" --to-ca-file "$CERTS/ca.pem")
          tagged=$(oras resolve --ca-file "$CERTS/ca.pem" "$OCI_REPOSITORY:$VERSION")
          other=$(SOURCE_DATE_EPOCH=$((epoch + 1)) scripts/oci-publish.sh dist "$VERSION" "$RUNNER_TEMP/other" --to-oci-layout)
          echo "first push:  $REF"
          echo "second push: $again"
          echo "tag:         $tagged"
          echo "other date:  $other"
          if [ "$again" != "$REF" ] || [ "$tagged" != "${REF#*@}" ]; then
            echo "::error::Publishing the same snapshot twice gave different digests."
            exit 1
          fi
          if [ "${other#*@}" = "${REF#*@}" ]; then
            echo "::error::Another SOURCE_DATE_EPOCH gave the same digest."
            exit 1
          fi
          annotated=$(oras manifest fetch --ca-file "$CERTS/ca.pem" "$REF" |
            jq -r '.annotations["org.opencontainers.image.revision"]')
          echo "revision:    $annotated"
          if [ "$annotated" != "$revision" ]; then
            echo "::error::The index is annotated with revision '$annotated', not $revision."
            exit 1
          fi
      - name: Install the provider with OpenTofu from the registry
        env:
          VERSION: ${{ steps.publish.outputs.version }}
        run: |
          # Outside the checkout, so that only the CLI configuration below
          # decides where the provider comes from.
          dir=$RUNNER_TEMP/tofu
          mkdir -p "$dir"
          # OpenTofu has no CA option for OCI registries; Go reads SSL_CERT_FILE.
          export SSL_CERT_FILE=$CERTS/ca.pem TF_CLI_CONFIG_FILE=$dir/tofurc
          cat > "$dir/tofurc" <<EOF
          provider_installation {
            oci_mirror {
              repository_template = "${OCI_REPOSITORY%/*}/terraform-provider-\${type}"
              include             = ["registry.opentofu.org/joelmuehlena/pdns"]
            }
            direct {
              exclude = ["registry.opentofu.org/joelmuehlena/pdns"]
            }
          }
          EOF
          # A snapshot is a pre-release, so it is selected only by its exact version.
          cat > "$dir/main.tf" <<EOF
          terraform {
            required_providers {
              pdns = {
                source  = "joelmuehlena/pdns"
                version = "$VERSION"
              }
            }
          }
          EOF
          tofu -chdir="$dir" init -input=false -no-color | tee "$dir/init.log"
          grep -F "Installed joelmuehlena/pdns v$VERSION (verified checksum)" "$dir/init.log"
          # The lock file records the zip's SHA-256 as its zh: hash.
          platform=$(tofu version -json | jq -r .platform)
          sum=$(grep "_${platform}.zip\$" "dist/terraform-provider-pdns_${VERSION}_SHA256SUMS" | cut -d' ' -f1)
          grep -F "\"zh:$sum\"" "$dir/.terraform.lock.hcl"
          # The installed provider starts and serves its schema.
          tofu -chdir="$dir" providers schema -json |
            jq -e '.provider_schemas["registry.opentofu.org/joelmuehlena/pdns"].resource_schemas.pdns_zone' >/dev/null

  test:
    name: test (${{ matrix.cli }} ${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The 3 latest minor versions of each CLI.
        include:
          - { cli: terraform, version: "1.15.*" }
          - { cli: terraform, version: "1.16.*" }
          - { cli: terraform, version: "1.17.*" }
          - { cli: tofu, version: "1.11.*" }
          - { cli: tofu, version: "1.12.*" }
          - { cli: tofu, version: "1.13.*" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: "go.mod"
          cache: true
      - if: matrix.cli == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.version }}
          terraform_wrapper: false
      - if: matrix.cli == 'tofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ matrix.version }}
          tofu_wrapper: false
      - name: Test
        env:
          CLI: ${{ matrix.cli }}
        run: |
          if [ "$CLI" = tofu ]; then
            TF_ACC_TERRAFORM_PATH=$(command -v tofu)
            export TF_ACC_TERRAFORM_PATH
            export TF_ACC_PROVIDER_HOST=registry.opentofu.org
          fi
          go test -race -count=1 -cover ./...

  # The full-stack example end to end (examples/full-stack/run.sh), with the
  # provider built from this change. It is installed from a filesystem
  # mirror rather than with dev_overrides, which `tofu init` does not skip.
  example:
    name: example (${{ matrix.cli }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cli: [terraform, tofu]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: "go.mod"
          cache: true
      - if: matrix.cli == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.*"
          terraform_wrapper: false
      - if: matrix.cli == 'tofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.13.*"
          tofu_wrapper: false
      - name: Install the provider into a filesystem mirror
        run: |
          mirror=$RUNNER_TEMP/mirror
          platform=$(go env GOOS)_$(go env GOARCH)
          # Any version that satisfies the constraint in examples/full-stack.
          for host in registry.terraform.io registry.opentofu.org; do
            go build -o "$mirror/$host/joelmuehlena/pdns/0.4.0/$platform/terraform-provider-pdns_v0.4.0" .
          done
          cat > "$RUNNER_TEMP/mirror.tfrc" <<EOF
          provider_installation {
            filesystem_mirror {
              path    = "$mirror"
              include = ["registry.terraform.io/joelmuehlena/pdns", "registry.opentofu.org/joelmuehlena/pdns"]
            }
            direct {
              exclude = ["registry.terraform.io/joelmuehlena/pdns", "registry.opentofu.org/joelmuehlena/pdns"]
            }
          }
          EOF
          echo "TF_CLI_CONFIG_FILE=$RUNNER_TEMP/mirror.tfrc" >> "$GITHUB_ENV"
      - name: Install dig and nsupdate
        run: |
          if ! command -v dig >/dev/null || ! command -v nsupdate >/dev/null; then
            sudo apt-get update -q && sudo apt-get install -yq bind9-dnsutils
          fi
      - name: Run the example
        env:
          TF: ${{ matrix.cli }}
        run: examples/full-stack/run.sh

  acceptance:
    name: acceptance (pdns ${{ matrix.pdns }}, ${{ matrix.backend }}${{ matrix.server_args && format(', {0}', matrix.server_args) || '' }}${{ matrix.cli == 'tofu' && ', tofu' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each backend needs a test/acc/compose.<backend>.yml.
        pdns: ["4.9", "5.0", "5.1"]
        backend: [gsqlite3, gpgsql]
        # Extra pdns_server arguments (PDNS_ACC_SERVER_ARGS).
        server_args: [""]
        # CLI that runs the tests: terraform everywhere, tofu on the latest
        # PowerDNS with each backend (see the includes).
        cli: [terraform]
        include:
          # The recommended dnsupdate-require-tsig (5.0+, refused by 4.9). It
          # does not depend on the backend.
          - { pdns: "5.0", backend: gsqlite3, server_args: "--dnsupdate-require-tsig=yes", cli: terraform }
          - { pdns: "5.1", backend: gsqlite3, server_args: "--dnsupdate-require-tsig=yes", cli: terraform }
          - { pdns: "5.1", backend: gsqlite3, server_args: "", cli: tofu }
          - { pdns: "5.1", backend: gpgsql, server_args: "", cli: tofu }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: "go.mod"
          cache: true
      - if: matrix.cli == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.*"
          terraform_wrapper: false
      - if: matrix.cli == 'tofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.13.*"
          tofu_wrapper: false
      - name: Acceptance tests
        env:
          CLI: ${{ matrix.cli }}
          PDNS_VERSION: ${{ matrix.pdns }}
          PDNS_BACKEND: ${{ matrix.backend }}
          PDNS_ACC_SERVER_ARGS: ${{ matrix.server_args }}
        run: |
          if [ "$CLI" = tofu ]; then
            TF_ACC_TERRAFORM_PATH=$(command -v tofu)
            export TF_ACC_TERRAFORM_PATH
            export TF_ACC_PROVIDER_HOST=registry.opentofu.org
          fi
          test/acc/run.sh -v
