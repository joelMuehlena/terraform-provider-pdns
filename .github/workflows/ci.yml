name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tool versions for lint and build come from mise.toml.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: go golangci-lint
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: ${{ runner.os }}-lint-${{ hashFiles('mise.toml', '**/go.sum') }}
          restore-keys: ${{ runner.os }}-lint-
      - run: mise run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: go
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-build-${{ hashFiles('mise.toml', '**/go.sum') }}
          restore-keys: ${{ runner.os }}-build-
      - run: mise run build
      - run: mise run vet

  test:
    name: test (${{ matrix.cli }} ${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The 3 latest minor versions of each CLI.
        include:
          - { cli: terraform, version: "1.15.*" }
          - { cli: terraform, version: "1.16.*" }
          - { cli: terraform, version: "1.17.*" }
          - { cli: tofu, version: "1.11.*" }
          - { cli: tofu, version: "1.12.*" }
          - { cli: tofu, version: "1.13.*" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true
      - if: matrix.cli == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.version }}
          terraform_wrapper: false
      - if: matrix.cli == 'tofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ matrix.version }}
          tofu_wrapper: false
      - name: Test
        env:
          CLI: ${{ matrix.cli }}
        run: |
          if [ "$CLI" = tofu ]; then
            export TF_ACC_TERRAFORM_PATH="$(command -v tofu)"
            export TF_ACC_PROVIDER_HOST=registry.opentofu.org
          fi
          go test -race -count=1 -cover ./...

  acceptance:
    name: acceptance (pdns ${{ matrix.pdns }}, ${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each backend needs a test/acc/compose.<backend>.yml.
        pdns: ["4.9", "5.0", "5.1"]
        backend: [gsqlite3, gpgsql]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.*"
          terraform_wrapper: false
      - name: Acceptance tests
        env:
          PDNS_VERSION: ${{ matrix.pdns }}
          PDNS_BACKEND: ${{ matrix.backend }}
        run: test/acc/run.sh -v
