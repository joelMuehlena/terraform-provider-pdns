name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tool versions for lint and build come from mise.toml.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: go golangci-lint
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: ${{ runner.os }}-lint-${{ hashFiles('mise.toml', '**/go.sum') }}
          restore-keys: ${{ runner.os }}-lint-
      - run: mise run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: go
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-build-${{ hashFiles('mise.toml', '**/go.sum') }}
          restore-keys: ${{ runner.os }}-build-
      - run: mise run build
      - run: mise run vet

  # docs/ is generated from the schema descriptions, examples/ and the
  # tfplugindocs templates; fail when a change did not regenerate it.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          # tofu formats the examples, terraform exports the provider schema.
          install_args: go terraform opentofu
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-docs-${{ hashFiles('mise.toml', '**/go.sum') }}
          restore-keys: ${{ runner.os }}-docs-
      - run: mise run generate
      - name: Check for drift
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            echo "::error::docs/ or examples/ are out of date. Run 'mise run generate' and commit the result."
            exit 1
          fi

  test:
    name: test (${{ matrix.cli }} ${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The 3 latest minor versions of each CLI.
        include:
          - { cli: terraform, version: "1.15.*" }
          - { cli: terraform, version: "1.16.*" }
          - { cli: terraform, version: "1.17.*" }
          - { cli: tofu, version: "1.11.*" }
          - { cli: tofu, version: "1.12.*" }
          - { cli: tofu, version: "1.13.*" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: "go.mod"
          cache: true
      - if: matrix.cli == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.version }}
          terraform_wrapper: false
      - if: matrix.cli == 'tofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ matrix.version }}
          tofu_wrapper: false
      - name: Test
        env:
          CLI: ${{ matrix.cli }}
        run: |
          if [ "$CLI" = tofu ]; then
            export TF_ACC_TERRAFORM_PATH="$(command -v tofu)"
            export TF_ACC_PROVIDER_HOST=registry.opentofu.org
          fi
          go test -race -count=1 -cover ./...

  acceptance:
    name: acceptance (pdns ${{ matrix.pdns }}, ${{ matrix.backend }}${{ matrix.server_args && format(', {0}', matrix.server_args) || '' }}${{ matrix.cli == 'tofu' && ', tofu' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each backend needs a test/acc/compose.<backend>.yml.
        pdns: ["4.9", "5.0", "5.1"]
        backend: [gsqlite3, gpgsql]
        # Extra pdns_server arguments (PDNS_ACC_SERVER_ARGS).
        server_args: [""]
        # CLI that runs the tests: terraform everywhere, tofu on the latest
        # PowerDNS with each backend (see the includes).
        cli: [terraform]
        include:
          # The recommended dnsupdate-require-tsig (5.0+, refused by 4.9). It
          # does not depend on the backend.
          - { pdns: "5.0", backend: gsqlite3, server_args: "--dnsupdate-require-tsig=yes", cli: terraform }
          - { pdns: "5.1", backend: gsqlite3, server_args: "--dnsupdate-require-tsig=yes", cli: terraform }
          - { pdns: "5.1", backend: gsqlite3, server_args: "", cli: tofu }
          - { pdns: "5.1", backend: gpgsql, server_args: "", cli: tofu }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: "go.mod"
          cache: true
      - if: matrix.cli == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.*"
          terraform_wrapper: false
      - if: matrix.cli == 'tofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.13.*"
          tofu_wrapper: false
      - name: Acceptance tests
        env:
          CLI: ${{ matrix.cli }}
          PDNS_VERSION: ${{ matrix.pdns }}
          PDNS_BACKEND: ${{ matrix.backend }}
          PDNS_ACC_SERVER_ARGS: ${{ matrix.server_args }}
        run: |
          if [ "$CLI" = tofu ]; then
            export TF_ACC_TERRAFORM_PATH="$(command -v tofu)"
            export TF_ACC_PROVIDER_HOST=registry.opentofu.org
          fi
          test/acc/run.sh -v
