# Terraform Provider release workflow.
name: Release

# This GitHub action creates a release when a tag that matches the pattern
# "v*" (e.g. v0.1.0) is created.
on:
  push:
    tags:
      - "v*"

# Each job asks for the permissions it needs.
permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      # GitHub considers creating releases and uploading assets as writing contents.
      contents: write
      id-token: write # sign the build provenance (GitHub OIDC)
      attestations: write # store it with GitHub's attestations API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Allow goreleaser to access older tag information.
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: "go.mod"
          cache: true
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: release --clean
        env:
          # GitHub sets the GITHUB_TOKEN secret automatically.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
      # SLSA build provenance for every release asset listed in SHA256SUMS
      # (the zips and the registry manifest JSON), under their release names.
      # Verify with `gh attestation verify <zip> --repo <owner>/<repo>`.
      - name: Attest the build provenance of the release archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/terraform-provider-pdns_${{ fromJSON(steps.goreleaser.outputs.metadata).version }}_SHA256SUMS

  # Publishes the release archives as an OpenTofu OCI provider mirror artifact,
  # ghcr.io/<owner>/terraform-provider-pdns:<version> (see README, "Installing
  # from an OCI registry"). It uses the assets of the GitHub release, so the
  # registry serves the very zips (and checksums) the release does. The pushed
  # index is signed keyless with cosign and gets a GitHub build provenance
  # attestation, both by digest and both attached to it in the registry.
  oci:
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read # download the release assets
      packages: write # push to ghcr.io
      id-token: write # keyless cosign signature and attestation (GitHub OIDC)
      attestations: write # store the attestation with GitHub's attestations API
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # oras version from mise.toml.
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: oras
          cache: true
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: v3.1.4
      - name: Download release archives
        run: >-
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir dist
          --pattern '*.zip' --pattern '*_SHA256SUMS'
      - name: Log in to ghcr.io
        run: oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN"
      - name: Push the OCI artifact
        id: push
        run: |
          # Reproducible digest: the created annotation is the date of the
          # tagged commit (goreleaser stamps the binaries with it, too), not
          # the time of this run, so a re-run pushes the same digest.
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          # The revision annotation is the tagged commit as well: checkout
          # left it at HEAD (GITHUB_SHA), gh release download does not move it.
          OCI_REVISION=$(git rev-parse HEAD)
          export SOURCE_DATE_EPOCH OCI_REVISION
          # ghcr.io repository names must be lowercase.
          ref=$(scripts/oci-publish.sh dist "$GITHUB_REF_NAME" "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/terraform-provider-pdns")
          {
            echo "ref=$ref"
            echo "name=${ref%@*}"
            echo "digest=${ref#*@}"
          } >> "$GITHUB_OUTPUT"
          echo "Pushed \`$ref\`" >> "$GITHUB_STEP_SUMMARY"
      # Keyless: the certificate names this workflow and tag, and the bundle
      # with the transparency log proof is attached to the index as an OCI
      # referrer, so it can be verified offline. cosign uses the oras login.
      - name: Sign the OCI artifact
        run: cosign sign --yes "$REF"
        env:
          REF: ${{ steps.push.outputs.ref }}
      # SLSA build provenance of the index, signed with the workflow's
      # identity and stored with GitHub's attestations API and, as a Sigstore
      # bundle referrer, next to the artifact in the registry (credentials
      # from ~/.docker/config.json, written by the oras login above).
      # Storage records (artifact-metadata: write) exist for organization
      # repositories only, so none is created.
      - name: Attest the build provenance of the OCI artifact
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
