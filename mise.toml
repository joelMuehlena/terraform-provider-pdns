# Development tools and tasks. Install with `mise install`, list tasks with `mise tasks`.

[tools]
go = "1.27.4"
golangci-lint = "2.15.0"
# Docs generation formats examples with tofu and exports the schema with terraform;
# the unit tests drive terraform.
terraform = "1.17.2"
opentofu = "1.13.10"
# Release tooling: goreleaser builds the archives, oras (>= 1.3.0) publishes
# them as an OpenTofu OCI provider mirror artifact (`mise run oci`).
goreleaser = "2.20.2"
oras = "1.3.6"

[tasks.build]
description = "Build the provider"
run = "go build ./..."

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.test]
description = "Run unit tests"
run = "go test -race -cover ./..."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run ./..."

[tasks.generate]
description = "Format examples and regenerate docs"
dir = "{{config_root}}/tools"
run = "go generate ./..."

[tasks.testacc]
description = "Run acceptance tests against PowerDNS in docker (PDNS_VERSION, PDNS_BACKEND)"
run = "test/acc/run.sh"

[tasks.oci]
description = "Build a goreleaser snapshot and push it as an OpenTofu OCI provider mirror artifact to OCI_REPOSITORY (default localhost:5000/terraform-provider-pdns); args go to oras cp"
run = [
  "goreleaser release --snapshot --clean --skip=sign",
  # The snapshot has no tag to take the creation date and revision from: use HEAD's.
  'SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH:-$(git log -1 --format=%ct)}" OCI_REVISION="${OCI_REVISION:-$(git rev-parse HEAD)}" scripts/oci-publish.sh dist "$(jq -r .version dist/metadata.json)" "${OCI_REPOSITORY:-localhost:5000/terraform-provider-pdns}"',
]
