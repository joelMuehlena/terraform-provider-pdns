# gpgsql backend: a PostgreSQL server initialized with the schema shipped in
# the pdns image under test.
services:
  # Copies the schema out of the pdns image for the postgres init scripts.
  schema:
    image: ${PDNS_IMAGE:?PDNS_IMAGE is not set, see run.sh}
    user: root
    entrypoint: ["cp", "/usr/local/share/doc/pdns/schema.pgsql.sql", "/schema/"]
    volumes:
      - schema:/schema

  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE is not set, see run.sh}
    environment:
      POSTGRES_USER: pdns
      POSTGRES_PASSWORD: pdns
      POSTGRES_DB: pdns
    volumes:
      - schema:/docker-entrypoint-initdb.d:ro
    depends_on:
      schema:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pdns", "-d", "pdns"]
      interval: 2s
      timeout: 3s
      retries: 30

  pdns:
    volumes:
      - ./gpgsql.conf:/etc/powerdns/pdns.d/backend.conf:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  schema:
