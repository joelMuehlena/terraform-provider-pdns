# PowerDNS Authoritative server for the acceptance tests.
#
# Combine with exactly one backend override file. run.sh sets the images
# from images/*.Dockerfile:
#
#   PDNS_IMAGE=docker.io/powerdns/pdns-auth-51:5.1.7 \
#     docker compose -f compose.yml -f compose.gsqlite3.yml up -d --wait
#   PDNS_IMAGE=... POSTGRES_IMAGE=docker.io/library/postgres:17.12-alpine \
#     docker compose -f compose.yml -f compose.gpgsql.yml up -d --wait
#
# Environment:
#   PDNS_IMAGE        pdns-auth image (required)
#   POSTGRES_IMAGE    postgres image of the gpgsql backend (required there)
#   PDNS_ACC_API_KEY  API key (default acc-test-key)
#   PDNS_ACC_PORT     host port of the HTTP API (default 8081)
#   PDNS_ACC_DNS_PORT host port of the DNS listener, tcp and udp (default 15353,
#                     as mDNS uses 5353 on macOS)
#   PDNS_ACC_SERVER_ARGS
#                     extra pdns_server arguments (default none), e.g.
#                     --dnsupdate-require-tsig=yes
#
# The server listens on 5353 inside the container so that it also runs on
# rootless podman, which cannot bind ports below 1024.
services:
  pdns:
    image: ${PDNS_IMAGE:?PDNS_IMAGE is not set, see run.sh}
    # Appended to the pdns_server command line by the image's entrypoint.
    command: ${PDNS_ACC_SERVER_ARGS:-}
    environment:
      PDNS_AUTH_API_KEY: ${PDNS_ACC_API_KEY:-acc-test-key}
    volumes:
      - ./pdns.conf:/etc/powerdns/pdns.conf:ro
    ports:
      - "127.0.0.1:${PDNS_ACC_PORT:-8081}:8081/tcp"
      - "127.0.0.1:${PDNS_ACC_DNS_PORT:-15353}:5353/tcp"
      - "127.0.0.1:${PDNS_ACC_DNS_PORT:-15353}:5353/udp"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - |
          import os, urllib.request
          urllib.request.urlopen(urllib.request.Request(
              "http://127.0.0.1:8081/api/v1/servers/localhost",
              headers={"X-API-Key": os.environ["PDNS_AUTH_API_KEY"]}), timeout=2)
      interval: 2s
      timeout: 3s
      retries: 30
